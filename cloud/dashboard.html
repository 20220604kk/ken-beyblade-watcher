<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Cloud Watch · 監控專用</title><style>
body{background:#0a1222;color:#e4edf9;font:15px system-ui;margin:0;padding:40px}h1{font-size:36px;margin-bottom:8px}.muted{color:#8cabc9}header{display:flex;justify-content:space-between;align-items:center}.badge{background:#153c36;color:#8df1c4;padding:10px 16px;border-radius:30px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:28px 0}.card,section{background:#111f34;border:1px solid #293c56;border-radius:16px;padding:22px}h2{font-size:18px}.number{font-size:30px;color:#75c4ff}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #293c56;word-break:break-all}code{color:#a9caf1}.error{color:#ffbd83}footer{margin-top:24px;color:#8cabc9}#summary{margin:24px 0;font-size:18px}</style>
<header><div><span class="muted">KEN / OBSERVABILITY</span><h1>Cloud Watch</h1><span class="muted">雲地事件競速 · 監控專用儀表</span></div><span class="badge">購買永久隔離 · DRY RUN</span></header><div id="summary">載入中</div><div class="cards" id="stations"></div><section><h2>事件時間線 / Cloud × Local</h2><table><thead><tr><th>來源 / 商品</th><th>去重鍵</th><th>Cloud 首次</th><th>Local 首次</th><th>Winner</th></tr></thead><tbody id="events"></tbody></table></section><footer>Codex Cloud 並非永久 VPS；任務停止後不保證持續監控。通知僅寫入 dry-run sink。競速結果依觀測時間，需雙端校時。</footer>
<script>const el=id=>document.getElementById(id);function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}async function refresh(){try{const [s,events]=await Promise.all(['/api/cloud/status','/api/cloud/events'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));el('summary').textContent=(s.fixture?'FIXTURE 示範資料':'LIVE 掃描')+' · '+s.eventCount+' 個唯一事件 · '+s.dryRunCount+' 次 dry-run 通知';el('stations').replaceChildren();for(const id of ['funbox','eslite','shopping','japan','amazon']){const x=s.stations[id]||{};const c=node('div','');c.className='card';c.append(node('h2',id.toUpperCase()),node('div',x.state||'等待掃描'),node('p','HTTP '+(x.httpStatus??'未收到回應')+' · '+(x.latencyMs??'—')+' ms'),node('p','解析 '+(x.parsedCount??x.hits??0)+' 筆'),node('p','成功 '+(x.successes||0)+' / 失敗 '+(x.failures||0)),node('small',x.lastScan||'尚未掃描'),node('p',x.error||(x.latest||[]).join(' · ')));el('stations').append(c)}el('events').replaceChildren();for(const x of events){const tr=node('tr','');for(const v of [x.site+' / '+x.title,x.eventId,x.firstSeen.cloud||'—',x.firstSeen.local||'—',x.winner])tr.append(node('td',v));el('events').append(tr)}}catch(e){el('summary').textContent='狀態讀取失敗：'+e.message}}refresh();setInterval(refresh,3000)</script></html>
